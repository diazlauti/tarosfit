<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EFF2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B16" media="(prefers-color-scheme: dark)">
<meta name="description" content="Mi Rutina — llevá tu entrenamiento de gimnasio con cuenta propia, sincronizado entre el celu y la compu.">
<title>Mi Rutina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%233F6B4F'/%3E%3Cg stroke='%23EFF2ED' stroke-width='11' stroke-linecap='round' fill='none'%3E%3Cpath d='M56 62v56M124 62v56M38 78v24M142 78v24M56 90h68'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%233F6B4F'/%3E%3Cg stroke='%23EFF2ED' stroke-width='11' stroke-linecap='round' fill='none'%3E%3Cpath d='M56 62v56M124 62v56M38 78v24M142 78v24M56 90h68'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>Mi Rutina</h1>
    <p class="tag">Tu rutina y tu historial, sincronizados entre el celu y la compu.</p>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="email" autocomplete="email" required>
      <input type="password" id="auth-pass" placeholder="contraseña" autocomplete="current-password" required minlength="6">
      <button type="submit" class="btn block" id="auth-submit">Entrar</button>
    </form>
    <p class="auth-msg" id="auth-msg"></p>
    <div class="auth-links">
      <button type="button" class="linkbtn" id="auth-toggle">¿No tenés cuenta? Creá una</button>
      <button type="button" class="linkbtn" id="auth-forgot">Olvidé mi contraseña</button>
    </div>
  </div>
</div>

<div id="app-root" class="app-root hidden">
<div id="spiral"></div>
<header><h1 id="ttl">Hoy</h1><div class="sub" id="sub"></div></header>
<main>
  <div class="view" id="v-hoy"></div>
  <div class="view" id="v-historial"></div>
  <div class="view" id="v-progreso"></div>
  <div class="view" id="v-rutinas"></div>
</main>

<button id="fab" aria-label="Cronómetro de descanso">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
</button>
<div id="tpanel">
  <div class="ring">
    <svg viewBox="0 0 100 100" width="108" height="108">
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent-soft)" stroke-width="7"/>
      <circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 50 50)"/>
    </svg>
    <div class="t" id="tlab">1:00</div>
  </div>
  <div class="presets">
    <button class="preset" data-secs="60">60s</button>
    <button class="preset" data-secs="90">90s</button>
    <button class="preset" data-secs="150">2:30</button>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn sm" id="tgo" style="flex:1">Iniciar</button>
    <button class="btn sm ghost" id="trs" style="flex:1">Reiniciar</button>
  </div>
</div>

<nav>
  <button class="tab" data-tab="hoy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg><span>Hoy</span></button>
  <button class="tab" data-tab="historial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Historial</span></button>
  <button class="tab" data-tab="progreso">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M11 19V5M18 19v-7M3 19h18"/></svg><span>Progreso</span></button>
  <button class="tab" data-tab="rutinas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M8 10h8M8 14h8M8 18h5"/></svg><span>Rutinas</span></button>
</nav>

<div id="toast"></div>
<div class="back" id="modal">
  <div class="sheet"><h3 id="mtitle"></h3><p id="mtext"></p>
    <div class="acts"><button class="btn ghost" id="mno">Cancelar</button><button class="btn danger" id="myes">Confirmar</button></div>
  </div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/exercises.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
